name: Weekly precinct brief

on:
  # The scraper (joshgreenman1973/nypd-compstat-scraper) collects the new CompStat week on
  # Monday or Tuesday. Send Wednesday morning, with a Thursday backup in case NYPD published late.
  # Times are UTC: 12:00 UTC is 8 AM ET during EDT, 7 AM during EST.
  # Re-runs are safe — the script checks Buttondown for a brief already sent for this week
  # and exits without sending a second one.
  schedule:
    - cron: '0 12 * * 3'
    - cron: '0 12 * * 4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send even if a brief already went out for this week'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install: the send script uses only Node built-ins and files in this repo.
      - name: Send the weekly briefs
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: node scripts/send-weekly.js --send ${{ inputs.force && '--force' || '' }}
